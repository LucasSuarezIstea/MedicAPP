# Arma la APK de Android automáticamente en cada push a main
# y la publica en la sección "Releases" del repositorio.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm ci

      - name: Correr los tests
        run: npm test

      - name: Generar el proyecto Android
        run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      - name: Compilar la APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          GRADLE_OPTS: -Xmx4g

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MedicApp build ${{ github.run_number }}
          body: APK de MedicApp lista para instalar en Android.
          files: android/app/build/outputs/apk/release/app-release.apk
